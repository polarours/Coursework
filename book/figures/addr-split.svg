<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="720" height="190" role="img">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1B2A38; }
    .lbl { font-size: 12px; }
    .sm  { font-size: 10.5px; fill: #5B6B73; }
    .ttl { font-size: 13px; font-weight: 600; }
    .cell { font-size: 13px; font-weight: 600; }
  </style>
  <rect width="720" height="190" fill="#FFFFFF"/>
  <text x="60" y="34" class="ttl">32 位地址 → tag / index / offset</text>
  <text x="60" y="52" class="sm">块大小 16 字节、64 组时的位切分</text>
  <rect x="60" y="74" width="440" height="46" fill="#EEF2F5" stroke="#C9D4DC" stroke-width="1"/>
  <text x="280.0" y="96" class="cell" text-anchor="middle">tag · 22 位</text>
  <text x="280.0" y="112" class="sm" text-anchor="middle">bit 31–10</text>
  <line x1="60" y1="66" x2="60" y2="74" stroke="#1B2A38" stroke-width="1"/>
  <rect x="500" y="74" width="120" height="46" fill="#D6F2ED" stroke="#C9D4DC" stroke-width="1"/>
  <text x="560.0" y="96" class="cell" text-anchor="middle">index · 6 位</text>
  <text x="560.0" y="112" class="sm" text-anchor="middle">bit 9–4</text>
  <line x1="500" y1="66" x2="500" y2="74" stroke="#1B2A38" stroke-width="1"/>
  <rect x="620" y="74" width="80" height="46" fill="#FBEBD0" stroke="#C9D4DC" stroke-width="1"/>
  <text x="660.0" y="96" class="cell" text-anchor="middle">offset · 4 位</text>
  <text x="660.0" y="112" class="sm" text-anchor="middle">bit 3–0</text>
  <line x1="620" y1="66" x2="620" y2="74" stroke="#1B2A38" stroke-width="1"/>
  <line x1="700" y1="66" x2="700" y2="74" stroke="#1B2A38" stroke-width="1"/>
  <text x="700" y="62" class="sm" text-anchor="end">bit 0</text>
  <text x="60" y="62" class="sm">bit 31</text>
  <text x="280.0" y="144" class="sm" text-anchor="middle">与缓存行的 tag 比较</text>
  <text x="560.0" y="144" class="sm" text-anchor="middle">选中哪一组</text>
  <text x="660.0" y="144" class="sm" text-anchor="middle">组内第几个字节</text>
  <text x="60" y="176" class="sm">一次访问：用 index 选组 → 并行比较该组所有路的 tag → 命中则用 offset 取字节</text>
</svg>
