<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1B2A38; }
    .lbl { font-size: 12px; }
    .sm  { font-size: 10.5px; fill: #5B6B73; }
    .ttl { font-size: 13px; font-weight: 600; }
    .cell { font-size: 12.5px; font-weight: 600; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; }
  </style>
  <rect width="720" height="250" fill="#FFFFFF"/>
  <text x="40" y="34" class="ttl">Enigma：信号穿过转子与反射器，再原路返回</text>
  <text x="40" y="52" class="sm">反射器让信号走对称路径，因此加密与解密是同一个操作</text>
  <rect x="40" y="96" width="86" height="34" rx="4" fill="#FFFFFF" stroke="#C9D4DC" stroke-width="1.2"/>
  <text x="83.0" y="117.0" class="cell" text-anchor="middle">键盘</text>
  <rect x="146" y="96" width="86" height="34" rx="4" fill="#FFFFFF" stroke="#C9D4DC" stroke-width="1.2"/>
  <text x="189.0" y="117.0" class="cell" text-anchor="middle">插线板</text>
  <rect x="252" y="96" width="86" height="34" rx="4" fill="#FFFFFF" stroke="#C9D4DC" stroke-width="1.2"/>
  <text x="295.0" y="117.0" class="cell" text-anchor="middle">转子 I</text>
  <rect x="358" y="96" width="86" height="34" rx="4" fill="#FFFFFF" stroke="#C9D4DC" stroke-width="1.2"/>
  <text x="401.0" y="117.0" class="cell" text-anchor="middle">转子 II</text>
  <rect x="464" y="96" width="86" height="34" rx="4" fill="#FFFFFF" stroke="#C9D4DC" stroke-width="1.2"/>
  <text x="507.0" y="117.0" class="cell" text-anchor="middle">转子 III</text>
  <rect x="570" y="96" width="86" height="34" rx="4" fill="#FBEBD0" stroke="#C98A22" stroke-width="1.2"/>
  <text x="613.0" y="117.0" class="cell" text-anchor="middle">反射器</text>
  <line x1="126" y1="86" x2="656" y2="86" stroke="#159F8C" stroke-width="1.6"/>
  <path d="M 650 82 L 656 86 L 650 90" fill="none" stroke="#159F8C" stroke-width="1.6"/>
  <text x="46" y="80" class="sm">明文 →</text>
  <line x1="646" y1="142" x2="116" y2="142" stroke="#C98A22" stroke-width="1.6" stroke-dasharray="5 3"/>
  <path d="M 122 138 L 114 142 L 122 146" fill="none" stroke="#C98A22" stroke-width="1.6"/>
  <text x="108" y="138" class="sm" text-anchor="end">← 密文</text>
  <text x="40" y="174" class="sm">正向：明文经转子逐级替换，到反射器折返；反向：同一组转子逆序替换，回到灯板</text>
  <text x="40" y="192" class="sm">每加密一个字符转子前移一格，因此同一个字母在不同位置映射到不同的密文</text>
  <text x="40" y="238" class="sm">对称是设计缺陷：拿到同样的机器就能解密，盟军正是这样破译的</text>
</svg>
