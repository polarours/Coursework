        - universities/stanford.qmd
        - universities/berkeley.qmd
        - universities/cmu.qmd
        - universities/princeton.qmd
        - universities/gatech.qmd
        - universities/cornell.qmd
        - universities/umd.qmd
        - universities/amirkabir.qmd
        - universities/fordham.qmd
        - universities/uci.qmd
        - universities/ccny.qmd
        - universities/clemson.qmd
