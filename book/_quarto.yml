  author:
    - "Coursework Contributors"
  date: "2026-11-18"
  license: "CC BY-NC-SA 4.0"
  chapters:
    - index.qmd
    # 卷一：系统基础 / Volume I: Systems Foundations
    - part: "卷一 · 系统基础 / Systems Foundations"
      chapters:
        - vol1/index.qmd
        - vol1/ch01-foundations.qmd
        - vol1/ch02-memory.qmd
        - vol1/ch03-processes.qmd
        - vol1/ch12-workshop.qmd
    # 卷二：算法与数据结构 / Volume II: Algorithms & Data Structures
    - part: "卷二 · 算法与数据结构 / Algorithms and Data Structures"
      chapters:
        - vol2/index.qmd
        - vol2/ch04-search.qmd
        - vol2/ch05-graphs.qmd
        - vol2/ch06-heuristics.qmd
    # 卷三：网络与分布式 / Volume III: Networks & Distributed Systems
    - part: "卷三 · 网络与分布式 / Networks and Distributed Systems"
      chapters:
        - vol3/index.qmd
        - vol3/ch07-reliable-transport.qmd
        - vol3/ch08-consensus.qmd
    # 卷四：智能系统 / Volume IV: Intelligent Systems
    - part: "卷四 · 智能系统 / Intelligent Systems"
      chapters:
        - vol4/index.qmd
        - vol4/ch09-learning.qmd
        - vol4/ch10-search-and-learning.qmd
        - vol4/ch11-crypto.qmd
    # 卷五：真实作业集成 / Volume V: Real Assignments
    - part: "卷五 · 真实作业集成 / Real Assignments"
      chapters:
        - vol5/index.qmd
        - vol5/ch13-cxx-assignments.qmd
        - vol5/ch14-java-python-assignments.qmd
    # 附录 / Back matter
    - part: "附录 / Appendices"
      chapters:
        - backmatter/summary.qmd
        - backmatter/how-to-use.qmd

bibliography: references.bib

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true
    toc-depth: 3
    code-fold: true
    number-sections: true
  typst:
    toc: true
    number-sections: true
    margin-x: 2.5cm
    margin-y: 2.5cm

