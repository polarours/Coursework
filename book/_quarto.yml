bibliography: references.bib

resources:
  - assets/og-image.png

format:
  html:
    theme: [cosmo, styles.scss]
    include-in-header:
      text: |
        <meta property="og:image" content="https://polarours.github.io/Coursework/assets/og-image.png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:type" content="book">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:image" content="https://polarours.github.io/Coursework/assets/og-image.png">
    toc: true
    toc-depth: 3
    code-fold: true
    number-sections: true
  typst:
    toc: true
    number-sections: true
    margin-x: 2.5cm
    margin-y: 2.5cm
    # typst 后端没有 cjk-font 参数（Quarto 的 cjkmainfont 只对 LaTeX 生效），
    # 中文完全依赖字体回退。把 mainfont 直接设为 CJK 字体，中英文同族渲染；
    # 不设的话 typst 可能选中系统里字符集极小的装饰字体（例如 WPS 手写体）。
    mainfont: "Noto Serif CJK SC"
    monofont: "DejaVu Sans Mono"
    include-in-header:
      text: |
        #set text(font: ("Noto Serif CJK SC", "Noto Serif", "DejaVu Sans Mono"))
        #show heading: set text(font: ("Noto Serif CJK SC", "Noto Serif"))

execute:
  enabled: false
