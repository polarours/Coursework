        - vol1/ch03-processes.qmd
        - vol1/ch12-workshop.qmd
    # 卷二：算法与数据结构 / Volume II: Algorithms & Data Structures
    - part: "Volume II · Algorithms and Data Structures"
      chapters:
        - vol2/index.qmd
        - vol2/ch04-search.qmd
        - vol2/ch05-graphs.qmd
        - vol2/ch06-heuristics.qmd
    # 卷三：网络与分布式 / Volume III: Networks & Distributed Systems
    - part: "Volume III · Networks and Distributed Systems"
      chapters:
        - vol3/index.qmd
        - vol3/ch07-reliable-transport.qmd
        - vol3/ch08-consensus.qmd
    # 卷四：智能系统 / Volume IV: Intelligent Systems
    - part: "Volume IV · Intelligent Systems"
      chapters:
        - vol4/index.qmd
        - vol4/ch09-learning.qmd
        - vol4/ch10-search-and-learning.qmd
